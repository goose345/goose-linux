#!/usr/bin/env python3

import subprocess
import os

CONFIG = "/etc/openrc.conf"


def read_config():
    config = {}

    with open(CONFIG) as f:
        for line in f:
            line = line.strip()

            if not line or line.startswith("#"):
                continue

            name, value = line.split("=", 1)
            config[name.strip()] = value.strip().lower()

    return config


def service_exists(service):
    result = subprocess.run(
        ["rc-service", service, "status"],
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL
    )

    return result.returncode in (0, 1, 3, 4)


def is_enabled(service):
    result = subprocess.run(
        ["rc-update", "show", "default"],
        capture_output=True,
        text=True
    )

    for line in result.stdout.splitlines():
        if line.strip().startswith(service):
            return True

    return False


def enable(service):
    if not service_exists(service):
        print(f"Service not found: {service}")
        return

    if not is_enabled(service):
        subprocess.run(["rc-update", "add", service, "default"])
        print(f"Enabled: {service}")
    else:
        print(f"Already enabled: {service}")


def disable(service):
    if is_enabled(service):
        subprocess.run(["rc-update", "del", service, "default"])
        print(f"Disabled: {service}")
    else:
        print(f"Already disabled: {service}")


def main():
    if os.geteuid() != 0:
        print("Please run this program as root.")
        return

    config = read_config()

    for service, value in config.items():
        if value == "yes":
            enable(service)

        elif value == "no":
            disable(service)

        else:
            print(f"Invalid value for {service}: {value}")


if __name__ == "__main__":
    main()
